name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pin npm for lockfile compatibility
        run: npm install -g npm@10.9.2

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
